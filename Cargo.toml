[package]
name = "oxidenes"
version = "0.1.9"
edition = "2021"
authors = ["pf-github-code"]
description = "A cycle-accurate NES emulator with CRT simulation"
license = "MIT"
repository = "https://github.com/deaddeadbeef/OxideNES"
readme = "README.md"
keywords = ["nes", "emulator", "nintendo", "retro", "gaming"]
categories = ["games", "emulators"]

[dependencies]
minifb = "0.27"
cpal = "0.15"
blip_buf = "0.1"
ringbuf = "0.4"
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
crc32fast = "1"
ureq = "2"
semver = "1"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
