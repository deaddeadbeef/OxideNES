[package]
name = "nes-emulator"
version = "0.1.0"
edition = "2021"
description = "A cycle-accurate NES emulator with CRT simulation"
license = "MIT"
repository = "https://github.com/user/nes-emulator"
readme = "README.md"
keywords = ["nes", "emulator", "nintendo", "retro", "gaming"]
categories = ["games", "emulators"]

[dependencies]
minifb = "0.27"
cpal = "0.15"
blip_buf = "0.1"
ringbuf = "0.4"
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
