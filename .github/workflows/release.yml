name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ip-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/ip_compliance_audit.py

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked --version 0.22.1
      - run: cargo audit

  diagnostic-bundle:
    needs: [ip-compliance, security-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev
      - name: Resolve diagnostic comparison ref
        shell: bash
        run: |
          set -euo pipefail
          compare_ref=""
          if [[ -n "${{ github.event.before }}" && ! "${{ github.event.before }}" =~ ^0+$ ]]; then
            compare_ref="${{ github.event.before }}"
          fi
          echo "OXIDENES_COMPARE_REF=$compare_ref" >> "$GITHUB_ENV"
      - name: Run diagnostic cartridge bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/diagnostics
          cargo run --bin oxidenes-diagnostic -- --json target/diagnostics/release-baseline.json --no-stdout
          cargo run --bin oxidenes-diagnostic -- --bundle-dir target/diagnostics/release-bundle --baseline-json target/diagnostics/release-baseline.json --no-stdout
          comparison_args=()
          if [[ -n "${OXIDENES_COMPARE_REF:-}" ]]; then
            prior_checkout="$RUNNER_TEMP/oxidenes-prior-checkout"
            rm -rf "$prior_checkout"
            git worktree add --detach "$prior_checkout" "$OXIDENES_COMPARE_REF"
            (
              cd "$prior_checkout"
              python scripts/run_diagnostic_observability.py \
                --suite-dir "$GITHUB_WORKSPACE/target/diagnostics/release-prior-scenario-suite" \
                --skip-replay
            )
            comparison_args=(
              --compare-suite-dir target/diagnostics/release-prior-scenario-suite
              --fail-on-comparison-regression
            )
          fi
          python scripts/run_diagnostic_observability.py \
            --suite-dir target/diagnostics/release-scenario-suite \
            "${comparison_args[@]}"
          python scripts/verify_diagnostic_observability.py \
            --suite-dir target/diagnostics/release-scenario-suite
          python scripts/run_diagnostic_route.py \
            --suite-dir target/diagnostics/release-scenario-suite \
            --all-routes \
            --skip-tests \
            --output-dir target/diagnostics/release-scenario-suite/route-replay-matrix
          python scripts/run_diagnostic_route.py \
            --suite-dir target/diagnostics/release-scenario-suite
          python scripts/verify_diagnostic_route.py \
            --suite-dir target/diagnostics/release-scenario-suite \
            --require-matrix \
            --require-top-route \
            --expect-matrix-tests-skipped \
            --write-summary
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxidenes-diagnostic-bundle
          path: target/diagnostics/release-bundle
          if-no-files-found: warn
      - name: Upload diagnostic scenario suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxidenes-diagnostic-scenario-suite
          path: target/diagnostics/release-scenario-suite
          if-no-files-found: warn
      - name: Upload prior diagnostic scenario suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxidenes-diagnostic-prior-scenario-suite
          path: target/diagnostics/release-prior-scenario-suite
          if-no-files-found: ignore

  build:
    needs: [ip-compliance, security-audit]
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: oxidenes.exe
            asset_name: oxidenes-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: oxidenes
            asset_name: oxidenes-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: oxidenes
            asset_name: oxidenes-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          OXIDENES_RELEASE: "1"

      - name: Smoke Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "target\${{ matrix.target }}\release\${{ matrix.artifact_name }}" --version
          $exitCode = if ($null -eq $LASTEXITCODE) { 0 } else { $LASTEXITCODE }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Smoke Unix binary
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          chmod +x "$binary"
          "$binary" --version

      - name: Run tests
        run: cargo test --target ${{ matrix.target }}
        env:
          OXIDENES_RELEASE: "1"

      - name: Stage platform binary
        shell: bash
        run: |
          mkdir -p target/release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "target/release-assets/${{ matrix.asset_name }}"

      - name: Validate staged binary artifact
        run: python scripts/check_release_assets.py --asset-dir target/release-assets --expected-asset-name ${{ matrix.asset_name }}

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: |
          cargo install cargo-wix
          cargo wix --target ${{ matrix.target }} --nocapture
        env:
          OXIDENES_RELEASE: "1"

      - name: Validate Windows installer package
        if: matrix.os == 'windows-latest'
        run: python scripts/check_release_assets.py --asset-dir target/release-assets --expected-asset-name ${{ matrix.asset_name }} --installer-glob "target/wix/*.msi" --wix-source wix/main.wxs

      - name: Smoke Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke_windows_installer.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release-assets/${{ matrix.asset_name }}

      - name: Upload installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: oxidenes-windows-installer
          path: target/wix/*.msi

  release:
    needs: [build, diagnostic-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/oxidenes-windows-x64.exe/*
            artifacts/oxidenes-linux-x64/*
            artifacts/oxidenes-macos-arm64/*
            artifacts/oxidenes-windows-installer/*
