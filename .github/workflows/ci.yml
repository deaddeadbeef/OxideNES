name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  ip-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/ip_compliance_audit.py

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked --version 0.22.1
      - run: cargo audit

  diagnostic-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev
      - name: Resolve diagnostic comparison ref
        shell: bash
        run: |
          set -euo pipefail
          compare_ref=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            compare_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" && ! "${{ github.event.before }}" =~ ^0+$ ]]; then
            compare_ref="${{ github.event.before }}"
          fi
          echo "OXIDENES_COMPARE_REF=$compare_ref" >> "$GITHUB_ENV"
      - name: Run diagnostic cartridge bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/diagnostics
          cargo run --bin oxidenes-diagnostic -- --json target/diagnostics/ci-baseline.json --no-stdout
          cargo run --bin oxidenes-diagnostic -- --bundle-dir target/diagnostics/ci-bundle --baseline-json target/diagnostics/ci-baseline.json --no-stdout
          comparison_args=()
          if [[ -n "${OXIDENES_COMPARE_REF:-}" ]]; then
            prior_checkout="$RUNNER_TEMP/oxidenes-prior-checkout"
            rm -rf "$prior_checkout"
            git worktree add --detach "$prior_checkout" "$OXIDENES_COMPARE_REF"
            (
              cd "$prior_checkout"
              python scripts/run_diagnostic_observability.py \
                --suite-dir "$GITHUB_WORKSPACE/target/diagnostics/ci-prior-scenario-suite" \
                --skip-replay
            )
            comparison_args=(
              --compare-suite-dir target/diagnostics/ci-prior-scenario-suite
              --fail-on-comparison-regression
            )
          fi
          python scripts/run_diagnostic_observability.py \
            --suite-dir target/diagnostics/ci-scenario-suite \
            "${comparison_args[@]}"
          python scripts/verify_diagnostic_observability.py \
            --suite-dir target/diagnostics/ci-scenario-suite
          python scripts/run_diagnostic_route.py \
            --suite-dir target/diagnostics/ci-scenario-suite
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxidenes-diagnostic-bundle
          path: target/diagnostics/ci-bundle
          if-no-files-found: warn
          retention-days: 14
      - name: Upload diagnostic scenario suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxidenes-diagnostic-scenario-suite
          path: target/diagnostics/ci-scenario-suite
          if-no-files-found: warn
          retention-days: 14
      - name: Upload prior diagnostic scenario suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxidenes-diagnostic-prior-scenario-suite
          path: target/diagnostics/ci-prior-scenario-suite
          if-no-files-found: ignore
          retention-days: 14

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: oxidenes.exe
            asset_name: oxidenes-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: oxidenes
            asset_name: oxidenes-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: oxidenes
            asset_name: oxidenes-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          OXIDENES_RELEASE: "1"

      - name: Test
        run: cargo test --target ${{ matrix.target }}
        env:
          OXIDENES_RELEASE: "1"

      - name: Smoke Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "target\${{ matrix.target }}\release\${{ matrix.artifact }}" --version
          $exitCode = if ($null -eq $LASTEXITCODE) { 0 } else { $LASTEXITCODE }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Smoke Unix binary
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          chmod +x "$binary"
          "$binary" --version

      - name: Stage release-named artifact
        shell: bash
        run: |
          mkdir -p target/release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "target/release-assets/${{ matrix.asset_name }}"

      - name: Validate staged artifact
        run: python scripts/check_release_assets.py --asset-dir target/release-assets --expected-asset-name ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release-assets/${{ matrix.asset_name }}

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev
      - run: cargo clippy -- -D warnings
