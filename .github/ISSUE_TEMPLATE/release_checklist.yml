name: Release checklist
description: Track a release candidate with validation, packaging, tagging, and IP compliance gates.
title: "[Release]: "
labels: ["release"]
body:
  - type: markdown
    attributes:
      value: |
        Use this checklist before publishing a tag or GitHub Release.

        Release artifacts must not include commercial ROMs, BIOS files, copyrighted screenshots, box art, manuals, music, logos, trademarked character artwork, or recordings containing proprietary game content.
  - type: input
    id: version
    attributes:
      label: Version or milestone tag
      placeholder: "v0.3.2 or product-polish-m1-complete"
    validations:
      required: true
  - type: dropdown
    id: release_type
    attributes:
      label: Release type
      options:
        - Small milestone tag only
        - Major milestone tag only
        - GitHub Release with binaries
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Release scope
      description: Summarize what changed and why it is meaningful to users or maintainers.
    validations:
      required: true
  - type: checkboxes
    id: validation
    attributes:
      label: Required validation
      options:
        - label: "`cargo fmt -- --check`"
          required: true
        - label: "`cargo check`"
          required: true
        - label: "`cargo test`"
          required: true
        - label: "`cargo clippy -- -D warnings`"
          required: true
        - label: "`git diff --check`"
          required: true
        - label: "`cargo audit`"
          required: true
        - label: "`python scripts/ip_compliance_audit.py`"
          required: true
        - label: Diagnostic baseline and bundle commands pass, including `--json target/diagnostics/release-baseline.json` and `--bundle-dir target/diagnostics/latest-bundle --baseline-json target/diagnostics/release-baseline.json`.
          required: true
        - label: Diagnostic scenario suite command passes, including `--scenario-suite-dir target/diagnostics/scenario-suite`.
          required: true
        - label: Diagnostic scenario suite verifier passes, including `python scripts/verify_diagnostic_suite.py --suite-dir target/diagnostics/scenario-suite`.
          required: true
        - label: Diagnostic observability runner passes and writes debug-index, analysis, code-map, investigation-plan, and focused replay evidence, including `python scripts/run_diagnostic_observability.py --suite-dir target/diagnostics/scenario-suite`.
          required: true
        - label: Diagnostic observability verifier passes and contract-checks the AI-facing wrapper artifacts, including code-map source/test paths, investigation-plan routes, and `python scripts/verify_diagnostic_observability.py --suite-dir target/diagnostics/scenario-suite`.
          required: true
        - label: Diagnostic route-check runner passes for the top investigation route, including `python scripts/run_diagnostic_route.py --suite-dir target/diagnostics/scenario-suite`.
          required: true
        - label: Diagnostic observability comparison passes without regressions when a prior suite is supplied, including `--compare-suite-dir` and `--fail-on-comparison-regression`.
          required: false
        - label: GitHub Actions are green on Windows, macOS, Linux, clippy, fmt, security audit, IP compliance, and diagnostic bundle jobs.
          required: true
        - label: The `oxidenes-diagnostic-bundle`, `oxidenes-diagnostic-scenario-suite`, and prior-suite artifact when available are attached or linked as release evidence.
          required: true
  - type: checkboxes
    id: packaging
    attributes:
      label: Packaging checks
      options:
        - label: Release artifacts have clear platform-specific names.
          required: false
        - label: Windows installer builds and includes only redistributable files.
          required: false
        - label: Binary launches or reports version on each published platform.
          required: false
  - type: checkboxes
    id: tags
    attributes:
      label: Tags and releases
      options:
        - label: Small milestone tags use names such as `product-polish-m1-formatting`.
          required: false
        - label: Major milestone tags use names such as `product-polish-m1-complete`.
          required: false
        - label: GitHub Releases are published only for user-meaningful binary, packaging, compatibility, or stability changes.
          required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: IP compliance confirmation
      options:
        - label: No ROMs, BIOS files, copyrighted screenshots, box art, manuals, music, logos, trademarked character artwork, or proprietary recordings are included.
          required: true
        - label: Any screenshots or recordings use homebrew, public-domain, or original test content.
          required: true
        - label: Release notes use third-party names only as factual compatibility references and do not imply endorsement.
